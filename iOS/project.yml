name: EC20Mobile
options:
  bundleIdPrefix: com.ec20companion
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
settings:
  SWIFT_VERSION: "5.9"
  IPHONEOS_DEPLOYMENT_TARGET: "16.0"
  DEVELOPMENT_TEAM: ""
  CODE_SIGN_STYLE: Automatic
targets:
  EC20BridgeProtocol:
    type: framework
    platform: iOS
    sources:
      - path: ../Sources/EC20BridgeProtocol
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.ec20companion.bridge-protocol
      DEFINES_MODULE: YES
      GENERATE_INFOPLIST_FILE: YES
      SKIP_INSTALL: YES
  EC20Mobile:
    type: application
    platform: iOS
    sources:
      - path: EC20Mobile
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.ec20companion.mobile
      INFOPLIST_FILE: EC20Mobile/Resources/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ENABLE_PREVIEWS: YES
    dependencies:
      - target: EC20BridgeProtocol
      - sdk: Network.framework
      - sdk: CryptoKit.framework
      - sdk: CallKit.framework
